; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
lib_dir = ./src/
src_dir = ./
default_envs = gbsc-pro

[env:gbsc-pro]
lib_extra_dirs = ../shared
extra_scripts =
	pre:tools/adv-controller-image.py
	pre:tools/webui-build.py
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
board_build.flash_mode = qio
upload_speed = 460800
monitor_speed = 115200
lib_deps = 
	esp32async/ESPAsyncTCP@^2.0.0
	esp32async/ESPAsyncWebServer@^3.12.1
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.2
	crankyoldgit/IRremoteESP8266@^2.8.6
build_src_filter = 
	+<**/*.c>
	+<**/*.cpp>
	+<**/*.ino>
	-<./3rdparty/*>
	-<test/>
	-<public/>

[env:native]
platform = native
extra_scripts = pre:tools/native-paths.py
lib_extra_dirs = ../shared
; OLED: the ThingPulse library is only downloaded here; test/sim/oled-lib.cpp compiles it (see oled-host.h)
lib_deps = thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.2
lib_ignore = ESP8266 and ESP32 OLED driver for SSD1306 displays
build_flags = -std=gnu++11 -Wall -Wextra -I pro/drivers -I pro/ui -I test/sim -I test/sim/shim -I pro/link -I pro/settings -I pro/platform -I pro/api -I pro/update -I pro/profiles -I pro/screen -I pro/picture -I pro/input -I pro/log -I pro/adv -I pro/net -I pro/output -I .
build_src_filter = -<*> +<pro/settings/settings-registry.cpp> +<pro/settings/settings-store.cpp> +<pro/settings/settings-fs.cpp> +<pro/settings/settings-request.cpp> +<pro/platform/platform-caps.cpp> +<pro/settings/settings-bridge.cpp> +<pro/api/api-guard.cpp> +<pro/api/api-actions.cpp> +<pro/api/api-backup.cpp> +<pro/api/api-json.cpp> +<pro/api/screen-snapshot.cpp> +<pro/api/api-admission.cpp> +<pro/api/api-route-match.cpp> +<pro/api/api-live.cpp> +<pro/api/net-slow.cpp> +<pro/profiles/profile-args.cpp> +<pro/update/update-trailer.cpp> +<pro/update/update-rtc.cpp> +<pro/update/update-manifest.cpp> +<pro/update/http-parse.cpp> +<pro/update/ota-plan.cpp> +<pro/profiles/profile-names.cpp> +<pro/profiles/profile-modes.cpp> +<pro/profiles/profile-file.cpp> +<pro/profiles/profile-list.cpp> +<pro/profiles/profile-json.cpp> +<pro/profiles/profile-autoload.cpp> +<pro/drivers/stv9426-map.cpp> +<pro/drivers/stv9426-timing.cpp> +<pro/drivers/stv9426-shadow.cpp> +<pro/drivers/stv9426-driver.cpp> +<pro/drivers/stv9426-udc.cpp> +<pro/drivers/stv9426-test-screen.cpp> +<pro/ui/menu-strings.cpp> +<pro/ui/menu-tree.cpp> +<pro/ui/menu-model.cpp> +<pro/ui/menu-engine.cpp> +<pro/ui/osd-theme.cpp> +<pro/ui/osd-renderer.cpp> +<pro/ui/ir-input.cpp> +<pro/ui/menu-signal.cpp> +<pro/ui/encoder-input.cpp> +<pro/ui/oled-renderer.cpp> +<pro/ui/oled-splash.cpp> +<pro/ui/menu-keyboard.cpp> +<pro/ui/menu-catalog.cpp> +<pro/ui/tv-osd.cpp> +<pro/screen/screen-borders.cpp> +<pro/picture/picture-color.cpp> +<pro/input/input-types.cpp> +<pro/input/input-auto.cpp> +<pro/input/rgb-scart-judge.cpp> +<pro/input/input-identify.cpp> +<pro/input/sync-pulse.cpp> +<pro/link/adv-link-sched.cpp> +<pro/link/adv-link-client.cpp> +<pro/link/adv-controller-format.cpp> +<pro/link/adv-updater.cpp> +<pro/link/adv-state.cpp> +<pro/link/i2p-guard.cpp> +<pro/log/log-ring.cpp> +<pro/log/loop-watch.cpp> +<pro/log/log-lines.cpp> +<pro/log/log-signal.cpp> +<pro/log/event-ring.cpp> +<pro/adv/adv-store.cpp> +<pro/net/wifi-tune.cp