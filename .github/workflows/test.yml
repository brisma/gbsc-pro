# Every push to main and every pull request: all suites in the development container with the quick Playwright run
# (Android, iPhone, desktop), with the same tools/dev.py a contributor runs. Windows, macOS and Linux run their own
# suites before a release (test-native.yml), the full Playwright run too (test-full.yml); both also by hand.
name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:   # a newer push to the same branch or pull request replaces the run in progress
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  container:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Image (published tag, or built here when this commit introduces a new one)
        run: |
          docker compose pull dev || { echo "::warning::the image tag is not published (or not public): building it here"; docker compose build dev; }
      - name: The node_modules mount points as the runner user (Docker would create them as root on a Linux host)
        run: mkdir -p gbs-control/public/node_modules gbsc-pro-flasher/ui/node_modules
      - run: docker compose run --rm -T dev check --strict
      - run: docker compose run --rm -T dev build
      - name: Nothing in the repository belongs to root
        run: test -z "$(find . -user root -not -path './.git/*' -print -quit)"
