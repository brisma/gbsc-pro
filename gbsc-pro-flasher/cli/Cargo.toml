[package]
name = "gbsc-flasher-cli"
description = "GBSC PRO flasher, command line"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "gbsc-flasher"
path = "src/main.rs"

[dependencies]
gbsc-core = { path = "../core" }
clap = { version = "4.6", features = ["derive"] }
