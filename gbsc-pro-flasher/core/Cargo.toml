[package]
name = "gbsc-core"
description = "GBSC PRO flasher core: firmware files, port detection, flashing protocols, device API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "gbsc_core"

[dependencies]
flate2 = "1.1"
crc = "3.4"
serialport = "4.10"
md-5 = "0.10"
serde_json = "1"
base64 = "0.22"
ureq = "3.5"
tungstenite = "0.30"
mdns-sd = "0.21"

[dev-dependencies]
socket2 = "0.6"   # the upload progress test's fake unit: a small receive window
